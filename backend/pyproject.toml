[project]
name = "triage"
version = "0.1.0"
description = "Job Posting Triage Agent backend: API, worker, sweeper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "boto3>=1.35",
    "aws-lambda-powertools>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "moto[sqs]>=5.0",
    "boto3-stubs[sqs]>=1.35",
    "ruff>=0.8",
    "pyright[nodejs]>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle. I: import order. B: likely bugs. UP: modern syntax.
# S: bandit security checks. SIM: simplifications.
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; S101 would flag every test.
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
