version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/main"]
    schedule: { interval: weekly }
