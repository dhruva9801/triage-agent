include classpath("application.conf")

# "*" builds queue URLs from the request's Host header, so the same queue works
# from other containers (elasticmq:9324) and from your machine (localhost:9324).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  triage-work {
    # 30 s locally so you can watch retries happen. Production uses 1800 s
    # (6x the worker timeout); see infra/main/sqs.tf.
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "triage-work-dlq"
      maxReceiveCount = 3
    }
  }
  triage-work-dlq { }
}
